version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: npm
    directory: /tests/e2e-playwright
    schedule:
      interval: monthly
    ignore:
      # typescript-eslint supports TypeScript below 6.1 only, so keep 6.0.x.
      - dependency-name: typescript
        update-types:
          - version-update:semver-minor
          - version-update:semver-major

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
